<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <script src="character.js" defer></script>
    <link rel="stylesheet" href="character.css">
</head>
<body>
<section class="card">
    <img class="image" src="" alt="character image">
    <h2 class="name"></h2>
    <div class="stats">
        <p><strong>Class:</strong> <span id="class"></span></p>
        <p><strong>Level:</strong> <span id="level"></span></p>
        <p><strong>Health:</strong> <span id="health"></span></p>
    </div>
    <div class="buttons">
        <button id="attackBtn">Attacked</button>
        <button id="levelUpBtn">Level Up</button>
    </div>
</section>
</body>
</html>

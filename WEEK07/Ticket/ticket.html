
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FSY Counselor Preference Form</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="ticket.css" />
  <script src="ticket.js" defer></script>
</head>
<body>
  <main class="wrapper">
    <h1>Event Ticket</h1>

    <form id="fsyForm">
      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" required />
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" required />
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
      </div>

      <div class="field">
        <label for="ticketType">Type</label>
        <select
          id="ticketType"
          name="ticketType"
          aria-controls="notesContainer"
          aria-controls="accessCode"
          required
        >
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="availableDate">Available Start Date</label>
        <input id="availableDate" name="availableDate" type="date" required />
      </div>
      <div id="studentIdContainer" class="field full" hidden>
        <label for="studentId">Student I#</label>
        <input id="studentId" name="studentId" type="text" />
      </div>

      <div id="accessCode" class="field full" hidden>
        <label for="code">Access Code</label>
        <input id="code" name="code" type="text" />
      </div>

      <button class="full" type="submit">Create Ticket</button>
    </form>

    <h1 id="createdTicket" hidden>Ticket Created</h1>
    <section id="output" aria-live="polite"></section>
  </main>
</body>
</html>

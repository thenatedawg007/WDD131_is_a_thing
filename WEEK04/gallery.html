
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cool Gallery</title>

  <link rel="stylesheet" href="gallery.css">
</head>

<body>

  <header>
    <h1>Cool Gallery</h1>
  </header>

  <main>

    <section class="gallery">

      <figure>
        <img src="images/book-sm.jpg" alt="person reading a book">
      </figure>

      <figure>
        <img src="images/couch-sm.jpg" alt="person sitting on couch">
      </figure>

      <figure>
        <img src="images/desk-sm.jpg" alt="desktop workspace">
      </figure>

      <figure>
        <img src="images/keyboard-sm.jpg" alt="typing keyboard">
      </figure>

      <figure>
        <img src="images/phone-sm.jpg" alt="looking at phone">
      </figure>

      <figure>
        <img src="images/sit-sm.jpg" alt="person sitting">
      </figure>

    </section>

  </main>

  <dialog class="viewer">
    <button class="close-viewer">X</button>
    <img src="" alt="Expanded image">
  </dialog>

  <script src="gallery.js"></script>

</body>
</html>
